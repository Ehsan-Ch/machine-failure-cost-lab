<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img">
<title>What the chosen alert policy does</title><desc>Illustrative cost = 25 x missed failures + false alerts; this is not measured money saved.</desc>
<rect width="900" height="490" fill="#f7fafc"/>
<text x="36" y="42" fill="#11243c" font-size="24" text-anchor="start" font-family="Arial,sans-serif">What the chosen alert policy does</text>
<text x="36" y="67" fill="#34445c" font-size="13" text-anchor="start" font-family="Arial,sans-serif">Illustrative cost = 25 x missed failures + false alerts; this is not measured money saved.</text>
