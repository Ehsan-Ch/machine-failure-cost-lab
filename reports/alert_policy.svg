<text x="665" y="321" fill="#a56b15" font-size="32" text-anchor="start" font-family="Arial,sans-serif">118</text>
<text x="665" y="345" fill="#34445c" font-size="14" text-anchor="start" font-family="Arial,sans-serif">False alerts</text>
<text x="36" y="443" fill="#34445c" font-size="15" text-anchor="start" font-family="Arial,sans-serif">Threshold 0.011717 | recall 87.2% | precision 22.4% | alert rate 7.6%</text>
<text x="36" y="470" fill="#34445c" font-size="12" text-anchor="start" font-family="Arial,sans-serif">Threshold chosen on UDI 7001-8000. These measurements use the separate UDI 8001-10000 test block.</text>
